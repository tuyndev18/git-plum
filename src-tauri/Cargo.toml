[package]
name = "git-plum"
version = "0.1.0"
description = "Ứng dụng desktop mã nguồn mở quản lý repository Git"
authors = ["git-plum contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

# Bắt buộc từ lúc `src/bin/lanedist.rs` xuất hiện (công cụ đo phân bố lane, plan
# 04). Hai binary trong một crate làm `cargo run` không đoán được chạy cái nào, và
# `tauri dev` chạy đúng `cargo run --no-default-features --color always --` nên nó
# **đứt ngay**:
#
#   error: `cargo run` could not determine which binary to run.
#   available binaries: git-plum, lanedist
#
# `lanedist` là công cụ dòng lệnh chạy tay (`cargo run --bin lanedist <repo>`), còn
# `git-plum` là ứng dụng — nên mặc định phải là `git-plum`. Thêm bất kỳ bin nào nữa
# vào `src/bin/` cũng không sao chừng nào dòng này còn đây.
default-run = "git-plum"

[lib]
name = "git_plum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# tokio::process cho phép đọc stdout của git theo luồng, thay vì nạp cả
# Output 50MB vào bộ nhớ.
tokio = { version = "1.53.1", features = ["process", "io-util", "rt", "sync", "time", "macros"] }

# Kiểu lỗi có tên. Lưu ý: tauri command đòi kiểu lỗi phải impl Serialize,
# thiserror chỉ cho Display — phần Serialize viết tay trong error.rs.
thiserror = "2.0.20"

# Đầu ra của git là BYTE, không bảo đảm UTF-8 (tên tệp trên Linux, thông điệp
# commit mã hoá cũ). Phân tích Vec<u8> bằng bstr để tránh String::from_utf8
# gây hỏng dữ liệu âm thầm trên repo thật.
bstr = "1.13.1"
memchr = "2.8.3"

# Cache diff theo SHA commit (plan 02-05). LRU có chặn trên nên RAM không phình
# vô hạn trên repo lớn.
lru = "0.18.4"

parking_lot = "0.12.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MD5 của email tác giả, cho avatar Gravatar (tuỳ chọn, mặc định tắt).
#
# # Vì sao băm ở Rust chứ không ở giao diện
#
# Gravatar định danh bằng MD5, và Web Crypto của trình duyệt **không có MD5**
# (chỉ SHA). Ba đường: tự viết MD5 trong TypeScript, thêm một gói npm, hoặc băm
# ở đây. Chọn đây vì nó giữ **email tác giả không bao giờ rời khỏi Rust** — lớp
# giao diện chỉ nhận chuỗi hash. Với một công cụ mã nguồn mở mà người dùng phải
# tin được, thu hẹp đường đi của dữ liệu cá nhân đáng giá hơn một dependency.
#
# Không tự viết MD5: 16 byte đầu ra và một bảng hằng số, nhưng sai một bit thì
# hash vẫn *trông* hợp lệ và chỉ biểu hiện thành "avatar của người khác" — một
# lỗi không ai báo vì không ai biết avatar đúng phải là gì. Crate RustCrypto
# được kiểm nhiều hơn bất cứ thứ gì viết lại ở đây.
#
# MD5 ở đây **không** dùng cho mục đích mật mã, chỉ để khớp định danh Gravatar.
md-5 = "0.10.6"
# Theo dõi thay đổi trong `.git` — WORK-10. Từ Phase 4 ứng dụng **ghi**, và ghi dựa
# trên trạng thái cũ thì hỏng repo của người dùng; chủ dự án dùng terminal song song
# nên đây là ca thường, không phải ca biên.
#
# `notify-debouncer-full` cho sẵn phép gộp-và-trì-hoãn. Tự viết phép gộp là viết lại
# một thư viện đã có, và bản có sẵn còn xử lý ca "tệp bị thay bằng rename" — đúng cách
# git ghi `.git/index` (ghi `index.lock` rồi rename đè).
#
# 🔴 **0.6.0, KHÔNG phải 0.7.0.** 0.7.0 đòi rustc 1.85 còn `rust-version` của dự án
# (ở trên) ghim 1.82, nên cargo **tự lùi**:
#
#   warning: ignoring notify-debouncer-full@0.7.0 (which requires rustc 1.85)
#            to maintain git-plum's rust-version of 1.82
#
# Đây **không** phải giới hạn của máy (`rustc --version` là 1.98.1) — nó là
# `rust-version` của chính dự án. Nâng nó lên 1.85 để lấy 0.7.0 là một quyết định
# ngoài phạm vi plan 04-04. Ghim 0.6.0 tường minh để lần chạy `cargo add` sau không
# âm thầm kéo 0.7.0 vào rồi lùi lại kèm một warning không ai đọc.
#
# Cặp đã kiểm bằng `cargo tree -i notify`: **một** bản `notify` duy nhất trong cây,
# cả `git-plum` lẫn `notify-debouncer-full` cùng dùng nó — không trùng lặp.
notify = "8.2.0"
notify-debouncer-full = "0.6.0"

[dev-dependencies]
tempfile = "3.27.0"

# Snapshot test cho đầu ra gán lane: chụp một Vec<GraphRow> của hình dạng đã biết rồi
# so khác biệt khi mã đổi. Đòi repo mẫu có mã commit tất định — xem scripts/fixtures/.
insta = "1.48.0"

# Benchmark gán lane và phân tích git log ở mức 100k commit. Checkpoint #1 của phase
# đòi việc này nằm trong CI ngay trong phase, không để sau.
criterion = "0.8.2"

[features]
# Tính năng mặc định của Tauri; `cargo test` chạy được mà không cần webview.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Benchmark gán lane + phân tích log. `harness = false` là BẮT BUỘC với criterion:
# thiếu nó thì `cargo bench` chạy harness mặc định của Rust và benchmark không bao
# giờ chạy — thất bại im lặng, CI vẫn xanh.
[[bench]]
name = "graph"
harness = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
