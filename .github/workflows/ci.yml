# REL-04 — dựng và kiểm thử trên cả ba nền tảng ngay từ Phase 1.
#
# Bật sớm để lỗi riêng của Linux và macOS lộ ra khi còn rẻ. Hai cái bẫy phổ biến
# nhất đã tránh sẵn ở đây:
#   * Dùng `libwebkit2gtk-4.1-dev`, KHÔNG phải 4.0 — Tauri v2 cần 4.1.
#     Đây là nguyên nhân hỏng CI Linux hay gặp nhất khi chuyển từ v1 sang v2.
#   * Ghim `ubuntu-22.04` thay vì `ubuntu-latest`, để bản nâng cấp runner của
#     GitHub không làm vỡ build vào một sáng nào đó.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Giao diện — kiểm kiểu và kiểm thử
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  rust:
    name: Rust — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Cài phụ thuộc hệ thống (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Kiểm định dạng
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Kiểm thử
        run: cargo test --all-features
        working-directory: src-tauri

  # Checkpoint #1 của Phase 2 đòi benchmark gán lane và phân tích `git log` nằm trong
  # CI **ngay trong phase**, không để sau.
  #
  # Vì sao là một job RIÊNG chứ không phải một bước trong job `rust`: job đó chạy ma
  # trận ba nền tảng, nên một bước trơn thêm vào sẽ chạy benchmark ba lần mỗi lần push
  # để lấy ba con số không so sánh được với nhau. Một job không ma trận trên
  # windows-latest (nền tảng ưu tiên, quyết định 2026-09-21) cho đúng một con số.
  bench:
    name: Benchmark — gán lane và phân tích log
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # KHÔNG đặt ngưỡng thất bại tự động ở phase này. Runner của GitHub dùng chung tài
      # nguyên và nhiễu tới hàng chục phần trăm giữa các lần chạy, nên một ngưỡng cứng
      # chỉ sinh báo động giả rồi bị bỏ qua — tệ hơn là không có cổng nào. Mục đích của
      # job là **số được in ra và lưu lại** để checkpoint #1 ở plan 02-07 so sánh.
      #
      # CI runner không có repo 100k commit, nên benchmark chạy trên dữ liệu tổng hợp
      # tất định. Số đó bắt hồi quy qua thời gian nhưng KHÔNG phải số báo cáo cho
      # checkpoint #1 — số đó đo trên repo thật, xem doc comment của benches/graph.rs.
      - name: Chạy benchmark
        run: cargo bench --bench graph -- --warm-up-time 1 --measurement-time 3
        working-directory: src-tauri

      - uses: actions/upload-artifact@v4
        with:
          name: bench-criterion
          path: src-tauri/target/criterion/
          retention-days: 30

  bundle:
    name: Đóng gói — ${{ matrix.os }}
    # Chỉ chạy trên main, vì đóng gói chậm hơn nhiều so với kiểm thử.
    if: github.ref == 'refs/heads/main'
    needs: [frontend, rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Cài phụ thuộc hệ thống (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Dựng gói cài đặt
        run: npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: git-plum-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/
          retention-days: 7
