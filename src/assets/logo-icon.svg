<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    git-plum app icon (D-02). CÙNG hình học với logo-mark.svg, khác hai điểm:
    thêm rect nền tile bo góc, và dùng mã màu hex TĨNH thay cho biến CSS.

    Vì sao hex tĩnh: `tauri icon` rasterize tệp này ngoài ngữ cảnh trang web,
    không có :root nào để biến CSS resolve, nên màu sẽ ra rỗng và icon thành
    tấm trong suốt. Giá trị dưới đây PHẢI khớp theme tối trong
    src/styles/app.css:
      accent #9d7cd8 · accent-dim #6f5a99 · success #86b384 · bg #16161a
    Đổi bảng màu ở app.css thì đổi cả ở đây (docs/BRAND.md ghi lại ràng buộc).

    LƯU Ý cú pháp: KHÔNG viết hai dấu gạch ngang liền nhau trong chú thích XML
    (tên biến CSS dạng gạch-gạch-accent). `tauri icon` dùng parser XML nghiêm,
    gặp chuỗi đó là panic InvalidComment và không sinh được icon nào.
  -->

  <rect x="0" y="0" width="64" height="64" rx="13" fill="#16161a" />

  <!-- Thân quả mận: bầu dục bè ngang 34x30, tâm (32,37) -->
  <path
    d="M32,22
       C41.5,22 49,28.5 49,37
       C49,45.5 41.5,52 32,52
       C22.5,52 15,45.5 15,37
       C15,28.5 22.5,22 32,22 Z"
    fill="#9d7cd8"
  />

  <!-- Rãnh dọc mặt trước quả -->
  <path
    d="M34,23 C31,30.5 31,44 34,51"
    fill="none"
    stroke="#6f5a99"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!--
    Nhánh git. Hình học BẤT ĐỐI XỨNG có chủ ý: một thân chính THẲNG ĐỨNG, một
    nhánh rẽ sang phải. Đã thử hai phương án đối xứng (hai cuống toả đều sang
    hai bên) — cả hai đều đọc ra RÂU CÔN TRÙNG chứ không ra đồ thị, vì mắt
    người gộp hai nét đối xứng thành một cặp. Đồ thị commit thật luôn có một
    lane chính và nhánh rẽ ra một bên; giữ đúng vậy.
  -->
  <path
    d="M32,23 L32,13"
    fill="none"
    stroke="#86b384"
    stroke-width="3"
    stroke-linecap="round"
  />
  <!-- Nhánh rẽ phải: tách khỏi thân ở giữa, cong lên nút con -->
  <path
    d="M32,20 C36,20 41,19 43,15"
    fill="none"
    stroke="#86b384"
    stroke-width="3"
    stroke-linecap="round"
  />

  <circle cx="32" cy="11" r="4" fill="#86b384" />
  <circle cx="44" cy="13" r="3.5" fill="#86b384" />
</svg>
